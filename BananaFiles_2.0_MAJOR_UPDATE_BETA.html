}));\n  }else{\n    const el = document.getElementById('home-arcade-cnt'); if(el) el.textContent = 'Disabled';\n    const a = document.getElementById('cnt-arcade'); if(a) a.textContent = '—';\n  }\n\n  if(CFG.sources.mathscdn){jobs.push(MATHS_CDN.fetch().then(g=>{ST.games.push(...g);onLoaded()}).catch(e=>console.warn('[Maths CDN]',e.message)))}\n  if(CFG.sources.selenite){jobs.push(SELENITE.fetch().then(g=>{ST.games.push(...g);onLoaded()}).catch(e=>console.warn('[Selenite]',e.message)))}\n\n  if(!jobs.length && grid){\n    grid.innerHTML = '<div class=\"st\"><span class=\"empty-i\">📭</span><div class=\"empty-t\">No sources enabled</div><p>Enable a collection in Settings.</p></div>';\n  }\n\n  await Promise.allSettled(jobs);\n  ST.loaded = true;\n  onLoaded();\n  tbDone();\n}\n\nasync function reloadAll(){\n  ST.games = []; ST.visible = []; ST.rendered = 0; ST.loaded = false;\n  const grid = document.getElementById('gg');\n  if(grid) grid.innerHTML = '<div class=\"st\"><div class=\"spin\"></div><p>Reloading…</p></div>';\n  await loadGames();\n  toast('↺ Sources reloaded');\n}\n\nfunction loadCustomSrc(){\n  const v = (document.getElementById('custom-src-url').value || '').trim();\n  if(!v){ toast('⚠️ Enter a zones.json URL'); return; }\n  if(!/^https?:\\/\\//i.test(v)){ toast('⚠️ Must start with http'); return; }\n  CFG.customSrc = v; saveAll(); toast('Custom source set — reloading…'); reloadAll();\n}\nfunction clearCustomSrc(){\n  CFG.customSrc = '';\n  const el = document.getElementById('custom-src-url'); if(el) el.value = '';\n  saveAll(); toast('Custom source cleared'); reloadAll();\n}\n\n\nfunction setSort(s){\n  ST.sort = s;\n  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));\n  applyFilters();\n}\nfunction setView(v){\n  ST.view = v;\n  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));\n  renderGrid();\n}\nfunction setSF(sf){\n  ST.sf = sf;\n  document.querySelectorAll('[data-sf]').forEach(b => b.classList.toggle('on', b.dataset.sf === sf));\n  applyFilters();\n}\nfunction setTag(t){\n  ST.tag = t;\n  const sel = document.getElementById('tsel'); if(sel) sel.value = t;\n  document.querySelectorAll('#tag-cloud .tp').forEach(p => p.classList.toggle('on', (p.dataset.tag||'') === t));\n  applyFilters();\n}\n\n\nfunction assignRanks(){\n  const buckets={};\n  ST.games.forEach(g=>{ (buckets[g.source]=buckets[g.source]||[]).push(g); });\n  const keys=Object.keys(buckets);\n  if(!keys.length) return;\n  keys.forEach(k=>buckets[k].sort((a,b)=>(b.numId||0)-(a.numId||0) || a.title.localeCompare(b.title)));\n  const total=ST.games.length;\n  keys.forEach(k=>{\n    const arr=buckets[k], step=total/arr.length;\n    arr.forEach((g,i)=>{ g.rank=(i+0.5)*step; });\n  });\n}\n\nfunction applyFilters(){\n  let list = ST.games.slice();\n\n  if(ST.sf !== 'all')  list = list.filter(g => g.source === ST.sf);\n  if(ST.tag)           list = list.filter(g => g.tags && g.tags.indexOf(ST.tag) > -1);\n  if(ST.search){\n    const q = ST.search.toLowerCase();\n    list = list.filter(g => g.title.toLowerCase().indexOf(q) > -1);\n  }\n\n  switch(ST.sort){\n    case 'name':  list.sort((a,b)=>a.title.localeCompare(b.title)); break;\n    case 'namez': list.sort((a,b)=>b.title.localeCompare(a.title)); break;\n    case 'pop':   list.sort((a,b)=>GNM.getPop(b.numId,'year') - GNM.getPop(a.numId,'year')); break;\n    case 'shuf':  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; } break;\n    default:\n      \n      list.sort((a,b)=> (a.rank||0) - (b.rank||0) || a.title.localeCompare(b.title));\n  }\n\n  ST.visible = list;\n  ST.rendered = 0;\n  if(LM.done) lmReset();\n  renderGrid();\n  updateCounts();\n}\n\nfunction updateCounts(){\n  const c = document.getElementById('gcnt');\n  if(c) c.textContent = ST.visible.length.toLocaleString() + ' of ' + ST.games.length.toLocaleString() + ' items';\n  const t = document.getElementById('cnt-total');\n  if(t) animCount(t, ST.games.length + SCRATCH_GAMES.length);\n  const f = document.getElementById('favcnt');\n  if(f) f.textContent = ST.favs.length + ' saved';\n  const s = document.getElementById('sccnt');\n  if(s) s.textContent = SCRATCH_GAMES.length + ' projects';\n}\n\n\nfunction mkCard(g){\n  const div = document.createElement('div');\n  div.className = 'gc';\n  div.dataset.gid = g.id;\n  div.dataset.file = gameFile(g);\n  div.tabIndex = 0;\n  div.setAttribute('role', 'button');\n  div.setAttribute('aria-label', 'Play ' + g.title);\n  div.onclick = function(event){\n    if(event.target.closest('[data-fav],[data-dl],[data-open],[data-play]')) return;\n    event.stopPropagation();\n    openGame(g);\n  };\n\n  const fav   = ST.favs.indexOf(g.id) > -1;\n  const cover = g.source === 'scratch' ? 'sc-cover' : 'gcv';\n  let img = '';\n  if(g.cover){\n    const fb = g.cover2 ? ('this.onerror=null;this.src=\\'' + g.cover2 + '\\';this.onerror=function(){this.style.display=\\'none\\'}')\n                        : ('this.style.display=\\'none\\'');\n    img = '<img data-src=\"' + g.cover + '\" alt=\"\" loading=\"lazy\" onerror=\"' + fb + '\">';\n  }\n\n  div.innerHTML =\n    '<div class=\"' + cover + '\">' +\n      img +\n      (g.cover ? '' : '<div class=\"gcv-fb\">🎮</div>') +\n      '<div class=\"gcv-grad\"></div>' +\n      '<div class=\"gcv-src\">' + esc(g.srcLabel) + '</div>' +\n      '<div class=\"play-ov\"><button class=\"play-btn\" type=\"button\" data-play=\"' + g.id + '\" aria-label=\"Play ' + esc(g.title) + '\">▶</button></div>' +\n      '<button class=\"fav-btn' + (fav ? ' on' : '') + '\" data-fav=\"' + g.id + '\" title=\"Favorite\">' + (fav ? '★' : '☆') + '</button>' +\n    '</div>' +\n    '<div class=\"gcb\">' +\n      '<span class=\"gcb-t\" title=\"' + esc(g.title) + '\">' + esc(g.title) + '</span>' +\n      '<span class=\"gcb-s\">' + esc(g.srcLabel) + '</span>' +\n      '<button class=\"gc-open\" data-open=\"' + g.id + '\" title=\"Open in new tab\">↗</button>' +\n      '<button class=\"gc-dl\" data-dl=\"' + g.id + '\" title=\"Download\">⬇</button>' +\n    '</div>';\n  return div;\n}\n\nfunction renderGrid(){\n  const g = document.getElementById('gg');\n  if(!g) return;\n  g.innerHTML = '';\n  g.dispatchEvent(new Event('cardsrendered'));\n  g.classList.toggle('lv', ST.view === 'list');\n\n  if(!ST.visible.length){\n    g.innerHTML = '<div class=\"st\"><span class=\"empty-i\">' + (ST.games.length ? '🔍' : '📭') + '</span>' +\n      '<div class=\"empty-t\">' + (ST.games.length ? 'No results' : (ST.loaded ? 'Nothing loaded' : 'Loading…')) + '</div>' +\n      '<p>' + (ST.games.length ? 'Try a different search, tag or source filter.' : 'Enable a source in Settings, or press ↺ Reload.') + '</p></div>';\n    updateLoadMore();\n    return;\n  }\n  addBatch();\n}\n\nfunction updateLoadMore(){\n  const wrap = document.getElementById('loadMoreWrap');\n  const info = document.getElementById('loadInfo');\n  if(!wrap) return;\n  const more = ST.rendered < ST.visible.length;\n  if(LM.busy) return;                       // mid-morph: leave the UI alone\n  if(more){\n    if(LM.done) lmReset();\n    wrap.style.display = 'flex';\n    if(info) info.textContent = 'Showing ' + ST.rendered.toLocaleString() +\n                                ' of ' + ST.visible.length.toLocaleString();\n  }else if(ST.visible.length && ST.rendered >= ST.visible.length && ST.rendered > 0){\n    lmDeflate();                            // nothing left: deflate in place\n  }else{\n    wrap.style.display = 'none';\n  }\n}\n\nfunction addBatch(){\n  const g = document.getElementById('gg');\n  if(!g) return;\n  const end = Math.min(ST.rendered + PAGE, ST.visible.length);\n  const frag = document.createDocumentFragment();\n  for(let i = ST.rendered; i < end; i++){\n    const c = mkCard(ST.visible[i]);\n    c.style.animationDelay = Math.min((i - ST.rendered) * 0.014, 0.3) + 's';\n    frag.appendChild(c);\n  }\n  g.appendChild(frag);\n  ST.rendered = end;\n  hookLazy(g);\n  updateLoadMore();\n}\n\nfunction hookLazy(root){\n  const imgs = root.querySelectorAll('img[data-src]:not([data-obs])');\n  if(!imgs.length) return;\n  imgs.forEach(i => i.setAttribute('data-obs','1'));\n  const obs = new IntersectionObserver((en, o) => {\n    en.forEach(e => {\n      if(!e.isIntersecting) return;\n      const img = e.target;\n      o.unobserve(img);\n      \n      const src = img.dataset.src;\n      if(!src) return;\n      img.removeAttribute('data-src');\n      img.src = src;\n    });\n  }, {rootMargin:'300px'});\n  imgs.forEach(i => obs.observe(i));\n}\n\n\nfunction buildTagCloud(){\n  const tc = document.getElementById('tag-cloud');\n  if(!tc) return;\n  const tags = new Set();\n  ST.games.forEach(g => (g.tags||[]).forEach(t => tags.add(t)));\n  if(!tags.size){ tc.style.display = 'none'; return; }\n  tc.style.display = 'flex';\n  tc.innerHTML = '';\n  const all = document.createElement('button');\n  all.className = 'tp' + (ST.tag ? '' : ' on');\n  all.textContent = 'All';\n  all.dataset.tag = '';\n  tc.appendChild(all);\n  [...tags].sort().forEach(t => {\n    const p = document.createElement('button');\n    p.className = 'tp' + (ST.tag === t ? ' on' : '');\n    p.textContent = toTC(t);\n    p.dataset.tag = t;\n    tc.appendChild(p);\n  });\n}\nfunction buildTagSelect(){\n  const sel = document.getElementById('tsel');\n  if(!sel) return;\n  const tags = new Set();\n  ST.games.forEach(g => (g.tags||[]).forEach(t => tags.add(t)));\n  const cur = sel.value;\n  sel.innerHTML = '<option value=\"\">All Tags</option>';\n  [...tags].sort().forEach(t => {\n    const o = document.createElement('option');\n    o.value = t; o.textContent = toTC(t);\n    sel.appendChild(o);\n  });\n  sel.value = cur;\n}\n\n\nfunction renderScratch(){\n  const sg = document.getElementById('sg');\n  if(!sg) return;\n  const q = ST.scSearch.toLowerCase();\n  const list = q ? SCRATCH_GAMES.filter(g => g.title.toLowerCase().indexOf(q) > -1) : SCRATCH_GAMES;\n  sg.innerHTML = '';\n  if(!list.length){\n    sg.innerHTML = '<div class=\"st\"><span class=\"empty-i\">🔍</span><div class=\"empty-t\">No results</div><p>No Scratch project matches that search.</p></div>';\n    return;\n  }\n  const frag = document.createDocumentFragment();\n  list.forEach((g,i) => {\n    const c = mkCard(g);\n    c.style.animationDelay = Math.min(i * 0.008, 0.3) + 's';\n    frag.appendChild(c);\n  });\n  sg.appendChild(frag);\n  hookLazy(sg);\n}\n\nfunction addScratch(){\n  const input = document.getElementById('sc-id');\n  const raw = (input.value || '').trim();\n  if(!raw){ toast('⚠️ Enter a project ID or URL'); return; }\n  const m = raw.match(/projects\\/(\\d+)/);\n  const id = m ? m[1] : raw.replace(/\\D/g, '');\n  if(!id){ toast('⚠️ Invalid project ID'); return; }\n  let g = GAME_MAP.get('sc_' + id);\n  if(!g){\n    g = {\n      id:'sc_' + id, projectId:id, title:'Project #' + id,\n      url:'https://scratch.mit.edu/projects/' + id + '/embed',\n      cover:'https://uploads.scratch.mit.edu/get_image/project/' + id + '_480x360.png',\n      cover2:'https://cdn2.scratch.mit.edu/get_image/project/' + id + '_480x360.png',\n      source:'scratch', srcLabel:'Scratch', tags:['scratch'], mode:'src'\n    };\n    SCRATCH_GAMES.unshift(g);\n    GAME_MAP.set(g.id, g);\n    renderScratch();\n    updateCounts();\n  }\n  input.value = '';\n  openGame(g);\n}\n\n\nfunction toggleFav(id){\n  const i = ST.favs.indexOf(id);\n  if(i >= 0){ ST.favs.splice(i,1); toast('Removed from favorites'); }\n  else      { ST.favs.push(id);    toast('⭐ Saved to favorites'); }\n  saveAll();\n  const on = ST.favs.indexOf(id) > -1;\n  document.querySelectorAll('[data-fav=\"' + id + '\"]').forEach(b => {\n    b.classList.toggle('on', on);\n    b.textContent = on ? '★' : '☆';\n  });\n  updateCounts();\n  renderFavs();\n  if(window.BananaPersonal) window.BananaPersonal.refresh();\n}\nfunction renderFavs(){\n  const g = document.getElementById('fg');\n  if(!g) return;\n  const list = ST.favs.map(id => GAME_MAP.get(id)).filter(Boolean);\n  if(!list.length){\n    g.innerHTML = '<div class=\"st\"><span class=\"empty-i\">⭐</span><div class=\"empty-t\">No favorites yet</div><p>Click the ☆ on any card to save it here.</p></div>';\n    return;\n  }\n  g.innerHTML = '';\n  const frag = document.createDocumentFragment();\n  list.forEach(x => frag.appendChild(mkCard(x)));\n  g.appendChild(frag);\n  hookLazy(g);\n}\n\n\nfunction addRecent(g){\n  ST.recents = ST.recents.filter(x => x.id !== g.id);\n  ST.recents.unshift(g);\n  ST.recents = ST.recents.slice(0, 8);\n  renderRecent();\n}\nfunction renderRecent(){\n  const sec = document.getElementById('rp-sec');\n  const strip = document.getElementById('rp-strip');\n  if(!sec || !strip) return;\n  sec.style.display = ST.recents.length ? 'block' : 'none';\n  strip.innerHTML = '';\n  ST.recents.forEach(g => {\n    const c = document.createElement('div');\n    c.className = 'rpc';\n    c.dataset.gid = g.id;\n    c.innerHTML = (g.cover ? '<img src=\"' + g.cover + '\" alt=\"\" onerror=\"this.style.display=\\'none\\'\">' : '<div class=\"rpc-fb\">🎮</div>') +\n                  '<div class=\"rpc-name\">' + esc(g.title) + '</div>';\n    strip.appendChild(c);\n  });\n}\n\n\n\nconst GAME_HTML_CACHE = new Map();\nconst GAME_CACHE_LIMIT = 6;\nlet PLAYER_LOAD_TOKEN = 0;\nfunction cacheGamePage(source, html){\n  if(GAME_HTML_CACHE.has(source)) return GAME_HTML_CACHE.get(source);\n  const blobUrl = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));\n  GAME_HTML_CACHE.set(source, blobUrl);\n  while(GAME_HTML_CACHE.size > GAME_CACHE_LIMIT){\n    const [oldSource, oldUrl] = GAME_HTML_CACHE.entries().next().value;\n    GAME_HTML_CACHE.delete(oldSource);\n    URL.revokeObjectURL(oldUrl);\n  }\n  return blobUrl;\n}\nfunction setGamePerformance(active){\n  document.body.classList.toggle('game-active', !!active);\n  if(typeof ambStop === 'function' && active) ambStop();\n  if(typeof ambStart === 'function' && !active && typeof AMB !== 'undefined' && AMB.on) ambStart();\n}\nfunction _pv(){\n  return {\n    ov: document.getElementById('playerOverlay'),\n    frame: document.getElementById('playerFrame'),\n    title: document.getElementById('pv-title'),\n    loader: document.getElementById('pv-loader'),\n    lname: document.getElementById('pv-loader-name'),\n    blobUrl: window.__bananaGameBlob || ''\n  };\n}\n\n\nfunction gameFile(g){\n  if(!g) return '';\n  \n  if(g.url) return String(g.url);\n  if(g.filename) return String(g.filename);\n  const raw = String(g.raw || '');\n  const match = raw.match(/([^/?#]+\\.html)(?:[?#].*)?$/i);\n  return match ? decodeURIComponent(match[1]) : '';\n}\nfunction showPlayerShell(title){\n  const p = _pv();\n  p.title.textContent = title || 'Game';\n  p.lname.textContent = title || 'Loading game…';\n  p.loader.classList.remove('gone');\n  p.ov.classList.add('open');\n  document.body.classList.add('locked');\n}\n\nfunction hideLoader(){ _pv().loader.classList.add('gone'); }\n\n\nasync function playGame(filename, title, game){\n  const source = String(filename || '').trim();\n  if(!source){ toast('❌ This game has no file path'); return false; }\n  const p = _pv();\n  const token = ++PLAYER_LOAD_TOKEN;\n  p.frame.removeAttribute('srcdoc');\n  showPlayerShell(title);\n  setGamePerformance(true);\n  p.frame.onload = hideLoader;\n  const remote = /^https?:\\/\\//i.test(source);\n  if(game&&game.mode==='src'&&remote){p.frame.src=source;window.setTimeout(()=>{if(token===PLAYER_LOAD_TOKEN)hideLoader()},6000);return true}\n  if(!remote){\n    p.frame.src = source;\n    window.setTimeout(()=>{ if(token === PLAYER_LOAD_TOKEN) hideLoader(); }, 5000);\n    return true;\n  }\n\n  \n  const cached = GAME_HTML_CACHE.get(source);\n  if(cached){ p.frame.src = cached; return true; }\n  try{\n    const response = await fetch(source, {mode:'cors', cache:'no-store'});\n    if(!response.ok) throw new Error('HTTP ' + response.status);\n    let html = await response.text();\n    if(!/<(?:!doctype\\s+html|html|head|body|script|canvas)[\\s>]/i.test(html)){\n      throw new Error('The source did not look like an HTML game');\n    }\n    const base = source.replace(/\\/[^\\/]*$/, '/');\n    if(!/<base\\b[^>]*href/i.test(html)){\n      if(/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, '$&<base href=\"' + base + '\">');\n      else if(/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, '$&<head><base href=\"' + base + '\"></head>');\n      else html = '<!doctype html><html><head><base href=\"' + base + '\"></head><body>' + html + '</body></html>';\n    }\n    const blobUrl = cacheGamePage(source, html);\n    if(token !== PLAYER_LOAD_TOKEN || !p.ov.classList.contains('open')) return false;\n    p.frame.src = blobUrl;\n  }catch(error){\n    if(token !== PLAYER_LOAD_TOKEN) return false;\n    console.warn('[player] HTML preparation failed; loading direct source as fallback.', error);\n    p.frame.src = source;\n    toast('Direct mode fallback');\n  }\n  window.setTimeout(()=>{ if(token === PLAYER_LOAD_TOKEN) hideLoader(); }, 8000);\n  return true;\n}\n\nfunction openGame(g){\n  if(!g) return;\n  if(window.BananaPersonal) window.BananaPersonal.track(g);\n  const source = gameFile(g);\n  if(!source){ toast('❌ This game has no file path'); return; }\n  ST.cur = g;\n  addRecent(g);\n  playGame(source, g.title, g);\n}\n\nfunction closePlayer(){\n  const p = _pv();\n  PLAYER_LOAD_TOKEN++;\n  p.frame.onload = null;\n  p.frame.src = '';\n  p.ov.classList.remove('open');\n  document.body.classList.remove('locked');\n  setGamePerformance(false);\n  ST.cur = null;\n}\n\nasync function openGameInBlank(game){\n  const g = game || ST.cur;\n  if(!g){ toast('Nothing is playing'); return false; }\n  const source = gameFile(g);\n  if(!source){ toast('Nothing to open'); return false; }\n  const win = window.open('about:blank','_blank');\n  if(!win){ toast('Pop-up blocked — allow pop-ups for this file'); return false; }\n\n  const safeTitle = String(g.title || 'BananaFile').replace(/[<>&\"]/g,'');\n  const shell = () => {\n    win.document.open();\n    win.document.write('<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>'+safeTitle+'</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#090909}body{overflow:hidden}#msg{position:fixed;inset:0;display:grid;place-items:center;color:#ddd;font:14px system-ui;background:#090909}iframe{position:fixed;inset:0}</style></head><body><div id=\"msg\">Opening '+safeTitle+'…</div></body></html>');\n    win.document.close();\n  };\n  try{\n    shell();\n    if(/^https?:\\/\\//i.test(source)){\n      try{\n        const response = await fetch(source,{mode:'cors',cache:'no-store'});\n        if(!response.ok) throw new Error('HTTP '+response.status);\n        let html = await response.text();\n        if(!/<(?:!doctype\\s+html|html|head|body|script|canvas)[\\s>]/i.test(html)) throw new Error('The source did not return HTML');\n        const base = source.replace(/\\/[^\\/]*$/, '/');\n        if(!/<base\\b[^>]*href/i.test(html)){\n          if(/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i,'$&<base href=\"'+base+'\">');\n          else html = '<!doctype html><html><head><base href=\"'+base+'\"></head><body>'+html+'</body></html>';\n        }\n        win.document.open();\n        win.document.write(html);\n        win.document.close();\n        try{ if(window.BananaCloak) window.BananaCloak.applyTo(win.document); }catch(_){ }\n        try{ win.opener = null; }catch(_){ }\n        return true;\n      }catch(fetchErr){\n        console.warn('[blank player] fetch/write failed; keeping blank wrapper fallback.', fetchErr);\n        shell();\n        const frame = win.document.createElement('iframe');\n        frame.allow = 'fullscreen; autoplay; gamepad; clipboard-read; clipboard-write';\n        frame.allowFullscreen = true;\n        frame.src = source;\n        win.document.body.appendChild(frame);\n        const msg = win.document.getElementById('msg');\n        frame.addEventListener('load',()=>{ if(msg) msg.remove(); },{once:true});\n        try{ if(window.BananaCloak) window.BananaCloak.applyTo(win.document); }catch(_){ }\n        try{ win.opener = null; }catch(_){ }\n        return true;\n      }\n    }\n\n    \n    const frame = win.document.createElement('iframe');\n    frame.allow = 'fullscreen; autoplay; gamepad; clipboard-read; clipboard-write';\n    frame.allowFullscreen = true;\n    frame.src = source;\n    win.document.body.appendChild(frame);\n    const msg = win.document.getElementById('msg');\n    frame.addEventListener('load',()=>{ if(msg) msg.remove(); },{once:true});\n    try{ if(window.BananaCloak) window.BananaCloak.applyTo(win.document); }catch(_){ }\n    try{ win.opener = null; }catch(_){ }\n    return true;\n  }catch(err){\n    console.warn('[blank player] failed', err);\n    try{ win.close(); }catch(_){ }\n    toast('Could not open the game window');\n    return false;\n  }\n}\n\nfunction openNewTab(){\n  openGameInBlank(ST.cur);\n}\n\nfunction downloadGame(id){\n  const game = id ? GAME_MAP.get(id) : ST.cur;\n  const source = gameFile(game);\n  if(!game || !source){ toast('Nothing to download'); return; }\n  const link = document.createElement('a');\n  link.href = source;\n  link.download = source.split('/').pop().split('?')[0] || (game.title + '.html');\n  link.target = '_blank';\n  link.rel = 'noopener';\n  document.body.appendChild(link);\n  link.click();\n  link.remove();\n  toast('⬇ Downloading ' + game.title);\n}\n\nfunction fsGame(){\n  const frame = document.getElementById('playerFrame');\n  if(document.fullscreenElement){ document.exitFullscreen(); return; }\n  if(frame.requestFullscreen){ frame.requestFullscreen().catch(()=>toast('⚠️ Fullscreen was blocked')); }\n}\n\nfunction randomGame(){\n  const pool = ST.visible.length ? ST.visible : (ST.games.length ? ST.games : SCRATCH_GAMES);\n  if(!pool.length){ toast('No games loaded yet'); return; }\n  openGame(pool[Math.floor(Math.random() * pool.length)]);\n}\n\n\n\nconst LM = {btn:null, label:null, inView:false, busy:false, done:false, raf:0, mx:0, my:0};\n\nfunction lmSetText(text, withWave){\n  if(!LM.label) return;\n  LM.label.innerHTML = '';\n  [...text].forEach(function(ch, i){\n    const s = document.createElement('span');\n    s.className = 'lc';\n    s.textContent = ch;\n    s.style.setProperty('--i', i);\n    // scatter targets: translateY -20..-40px, rotate -15..15deg\n    s.style.setProperty('--sy', (-20 - Math.random() * 20).toFixed(1) + 'px');\n    s.style.setProperty('--sr', (Math.random() * 30 - 15).toFixed(1) + 'deg');\n    LM.label.appendChild(s);\n  });\n  if(withWave){\n    const w = document.createElement('span');\n    w.className = 'lm-wave';\n    w.textContent = '🍌';\n    LM.label.appendChild(w);\n  }\n}\n\nfunction lmApply(){\n  LM.raf = 0;\n  const b = LM.btn;\n  if(!b || !LM.inView || LM.done) return;\n  const r = b.getBoundingClientRect();\n  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;\n  const dx = LM.mx - cx, dy = LM.my - cy;\n  const dist = Math.hypot(dx, dy);\n  const R = 150;\n\n  if(dist > R){\n    b.classList.remove('magnet');\n    b.style.setProperty('--mx', '50%');\n    b.style.setProperty('--my', '50%');\n    return;\n  }\n  // inverse-square falloff: strongest right at the button\n  const t = 1 - dist / R;\n  const pull = t * t;\n  b.classList.add('magnet');\n  \n  const MAXPULL = 18;                                  // px at full strength\n  const ox = (dx / dist) * MAXPULL * pull;\n  const oy = (dy / dist) * MAXPULL * pull;\n  b.style.setProperty('--mx', (50 + ox / r.width  * 100).toFixed(3) + '%');\n  b.style.setProperty('--my', (50 + oy / r.height * 100).toFixed(3) + '%');\n}\n\nfunction lmLoadMore(){\n  if(LM.busy || LM.done) return;\n  const b = LM.btn;\n  if(!b){ addBatch(); return; }\n\n  LM.busy = true;\n  b.classList.remove('settle');\n  b.classList.add('loading');\n  b.disabled = true;\n\n  const info = document.getElementById('loadInfo');\n  if(info) info.style.opacity = '0';\n\n  // scatter (20ms stagger) + spinner, then render and settle\n  setTimeout(function(){\n    addBatch();                                  // real work\n    const more = ST.rendered < ST.visible.length;\n    b.classList.remove('loading');\n    b.disabled = false;\n    LM.busy = false;\n\n    if(more){\n      lmSetText('Load More Games', false);\n      b.classList.add('settle');\n      setTimeout(function(){ b.classList.remove('settle'); }, 700);\n      if(info) info.style.opacity = '';\n    }else{\n      lmDeflate();\n    }\n  }, 620);\n}\n\nfunction lmDeflate(){\n  const b = LM.btn;\n  if(!b) return;\n  LM.done = true;\n  b.classList.remove('loading','settle','magnet');\n  b.style.setProperty('--mx','50%');\n  b.style.setProperty('--my','50%');\n  lmSetText(\"That's all, folks!\", true);\n  b.classList.add('done');\n  const wrap = document.getElementById('loadMoreWrap');\n  if(wrap) wrap.style.display = 'flex';\n  const info = document.getElementById('loadInfo');\n  if(info){ info.textContent = ''; info.style.opacity = ''; }\n}\n\nfunction lmReset(){\n  const b = LM.btn;\n  if(!b) return;\n  LM.done = false; LM.busy = false;\n  b.classList.remove('done','loading','settle');\n  b.disabled = false;\n  lmSetText('Load More Games', false);\n}\n\nfunction initLoadMore(){\n  const b = document.getElementById('loadMoreBtn');\n  if(!b) return;\n  LM.btn = b;\n  b.textContent = '';\n  LM.label = document.createElement('span');\n  LM.label.className = 'lm-label';\n  b.appendChild(LM.label);\n  const sp = document.createElement('span');\n  sp.className = 'lm-spin';\n  b.appendChild(sp);\n  lmSetText('Load More Games', false);\n\n  // only compute the magnet while the button is visible\n  if('IntersectionObserver' in window){\n    new IntersectionObserver(function(en){\n      LM.inView = en[0].isIntersecting;\n      if(!LM.inView){\n        b.classList.remove('magnet');\n        b.style.setProperty('--mx','50%');\n        b.style.setProperty('--my','50%');\n      }\n    }, {rootMargin:'120px'}).observe(b);\n  }else{ LM.inView = true; }\n\n  document.addEventListener('mousemove', function(e){\n    if(!LM.inView || LM.done) return;\n    LM.mx = e.clientX; LM.my = e.clientY;\n    if(!LM.raf) LM.raf = requestAnimationFrame(lmApply);\n  }, {passive:true});\n}\n\n\nconst AMB = {\n  cv:null, ctx:null, parts:[], raf:0, dpr:1, on:true,\n  mx:-9999, my:-9999, w:0, h:0,\n  N:40, LINK:150, MOUSE:200\n};\n\nfunction ambBanana(ctx, size){\n  const s = size / 12;\n  ctx.scale(s, s);\n  ctx.beginPath();\n  ctx.moveTo(-4.6,-4.2);\n  ctx.bezierCurveTo(-6.0, 1.4, -2.2, 5.6, 4.6, 4.4);\n  ctx.bezierCurveTo( 5.6, 4.2,  5.9, 3.0, 5.0, 2.6);\n  ctx.bezierCurveTo( 0.4, 3.4, -3.0, 0.4, -2.4,-3.9);\n  ctx.bezierCurveTo(-2.5,-4.9, -4.3,-5.1, -4.6,-4.2);\n  ctx.closePath();\n  ctx.fill();\n}\n\nfunction ambResize(){\n  if(!AMB.cv) return;\n  AMB.dpr = Math.min(window.devicePixelRatio || 1, 2);\n  AMB.w = window.innerWidth;\n  AMB.h = window.innerHeight;\n  AMB.cv.width  = Math.floor(AMB.w * AMB.dpr);\n  AMB.cv.height = Math.floor(AMB.h * AMB.dpr);\n  AMB.cv.style.width  = AMB.w + 'px';\n  AMB.cv.style.height = AMB.h + 'px';\n  AMB.ctx.setTransform(AMB.dpr, 0, 0, AMB.dpr, 0, 0);\n}\n\nfunction ambSeed(){\n  AMB.parts = [];\n  for(let i = 0; i < AMB.N; i++){\n    AMB.parts.push({\n      x:  Math.random() * AMB.w,\n      y:  Math.random() * AMB.h,\n      vx: (Math.random() - 0.5) * 0.6,      // -0.3 .. 0.3\n      vy: (Math.random() - 0.5) * 0.4,      // -0.2 .. 0.2\n      rot: Math.random() * Math.PI * 2,\n      vr: (Math.random() - 0.5) * 1.0,      // -0.5 .. 0.5 deg/frame\n      spin: 0\n    });\n  }\n}\n\nfunction ambTick(){\n  const ctx = AMB.ctx, P = AMB.parts;\n  ctx.clearRect(0, 0, AMB.w, AMB.h);\n\n  // ── connecting lines (behind the glyphs) ──\n  ctx.lineWidth = 1;\n  for(let i = 0 nt = AMB.on;\n  const tg = document.getElementById('tg-ambient');\n  if(tg) tg.classList.toggle('on', AMB.on);\n  if(AMB.cv) AMB.cv.style.display = AMB.on ? 'block' : 'none';\n  if(AMB.on){ ambStart(); }\n  else{\n    ambStop();\n    if(AMB.ctx) AMB.ctx.clearRect(0, 0, AMB.w, AMB.h);\n  }\n  saveAll();\n}\nfunction toggleAmbient(){ ambSetEnabled(!AMB.on); }\n\nfunction ambInit(){\n  const cv = document.getElementById('ambCanvas');\n  if(!cv) return;\n  AMB.cv = cv;\n  AMB.ctx = cv.getContext('2d');\n  ambResize();\n  ambSeed();\n\n  window.addEventListener('resize', function(){ ambResize(); }, {passive:true});\n  window.addEventListener('mousemove', function(e){\n    AMB.mx = e.clientX; AMB.my = e.clientY;\n  }, {passive:true});\n  window.addEventListener('mouseout', function(){ AMB.mx = AMB.my = -9999; }, {passive:true});\n\n  // pause when the tab is hidden, resume on focus\n  document.addEventListener('visibilitychange', function(){\n    if(document.hidden) ambStop(); else ambStart();\n  });\n\n  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) AMB.on = false;\n  ambSetEnabled(CFG.ambient !== false && AMB.on);\n}\n\n\nconst FX = {\n  cv:null, ctx:null, parts:[], raf:0, dpr:1,\n  colors:['#FFE135','#FFD24A','#F0A500','#FFF6C9','#FFB300']\n};\n\nfunction fxInit(){\n  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;\n  const cv = document.getElementById('fxCanvas');\n  if(!cv) return;\n  FX.cv = cv;\n  FX.ctx = cv.getContext('2d');\n  fxResize();\n  window.addEventListener('resize', fxResize, {passive:true});\n}\n\nfunction fxResize(){\n  if(!FX.cv) return;\n  FX.dpr = Math.min(window.devicePixelRatio || 1, 2);\n  FX.cv.width  = Math.floor(window.innerWidth  * FX.dpr);\n  FX.cv.height = Math.floor(window.innerHeight * FX.dpr);\n  FX.cv.style.width  = window.innerWidth + 'px';\n  FX.cv.style.height = window.innerHeight + 'px';\n  FX.ctx.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);\n}\n\n\nlet _fxMeasure = null;\nfunction caretPoint(input){\n  const r  = input.getBoundingClientRect();\n  const cs = getComputedStyle(input);\n  if(!_fxMeasure) _fxMeasure = document.createElement('canvas').getContext('2d');\n  _fxMeasure.font = cs.font && cs.font !== ''\n    ? cs.font\n    : (cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily);\n  const pos  = (input.selectionStart == null) ? input.value.length : input.selectionStart;\n  const w    = _fxMeasure.measureText(input.value.slice(0, pos)).width;\n  const padL = parseFloat(cs.paddingLeft)     || 0;\n  const bdL  = parseFloat(cs.borderLeftWidth) || 0;\n  let x = r.left + bdL + padL + w - input.scrollLeft;\n  x = Math.max(r.left + 4, Math.min(x, r.right - 4));\n  return {x:x, y:r.top + r.height / 2};\n}\n\n\nfunction fxBurst(x, y){\n  if(!FX.ctx) return;\n  const n = 3 + Math.floor(Math.random() * 3);          // 3-5\n  for(let i = 0; i < n; i++){\n    const deg   = -45 - Math.random() * 90;             // -45 .. -135\n    const rad   = deg * Math.PI / 180;\n    const speed = 4 + Math.random() * 4;\n    // Direction comes from the angle; magnitudes are held inside the\n    // specified vx (-2..2) / vy (-4..-8) envelopes.\n    const vx = Math.max(-2, Math.min(2,  Math.cos(rad) * speed));\n    const vy = Math.max(-8, Math.min(-4, Math.sin(rad) * speed));\n    FX.parts.push({\n      x:x, y:y, vx:vx, vy:vy,\n      r:1 + Math.random(),                              // 2-4px diameter\n      c:FX.colors[(Math.random() * FX.colors.length) | 0],\n      life:0\n    });\n  }\n  fxStart();\n}\n\n\nfunction fxBigBurst(x, y){\n  if(!FX.ctx) return;\n  for(let i = 0; i < 20; i++){\n    const rad   = (i / 20) * Math.PI * 2 + Math.random() * 0.12;\n    const speed = 3 + Math.random() * 3.5;\n    FX.parts.push({\n      x:x, y:y,\n      vx:Math.cos(rad) * speed,\n      vy:Math.sin(rad) * speed,\n      r:1 + Math.random(),\n      c:FX.colors[(Math.random() * FX.colors.length) | 0],\n      life:0\n    });\n  }\n  fxStart();\n}\n\nfunction fxStart(){\n  if(!FX.raf && FX.parts.length) FX.raf = requestAnimationFrame(fxTick);\n}\n\nfunction fxTick(){\n  const ctx = FX.ctx;\n  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);\n\n  for(let i = FX.parts.length - 1; i >= 0; i--){\n    const p = FX.parts[i];\n    p.vx *= 0.98;                 // friction\n    p.vy *= 0.98;\n    p.vy += 0.25;                 // gravity\n    p.x  += p.vx;\n    p.y  += p.vy;\n    p.life++;\n\n    const alpha = 1 - p.life / 40;             // fade over 40 frames\n    if(alpha <= 0 || p.y - p.r > window.innerHeight){\n      FX.parts.splice(i, 1);                   // cull: faded or off-screen\n      continue;\n    }\n    ctx.globalAlpha = alpha;\n    ctx.fillStyle = p.c;\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  if(FX.parts.length){\n    FX.raf = requestAnimationFrame(fxTick);\n  }else{\n    FX.raf = 0;                                // idle: nothing renders\n    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);\n  }\n}\n\n\nfunction fxAttach(input){\n  if(!input) return;\n  let prev = input.value;\n  input.addEventListener('input', function(){\n    if(!FX.ctx) return;\n    const p = caretPoint(input);\n    if(input.value === '' && prev !== '') fxBigBurst(p.x, p.y);\n    else                                  fxBurst(p.x, p.y);\n    prev = input.value;\n  });\n  input.addEventListener('keydown', function(e){\n    if(e.key === 'Enter' && FX.ctx){\n      const p = caretPoint(input);\n      fxBigBurst(p.x, p.y);\n    }\n  });\n}\n\n\n\nlet AUDIO_CTX = null;\nlet AUDIO_ARMED = false;\n\nfunction armAudio(){\n  if(AUDIO_ARMED) return;\n  AUDIO_ARMED = true;\n  const AC = window.AudioContext || window.webkitAudioContext;\n  if(!AC) return;\n  try{\n    AUDIO_CTX = new AC();\n    if(AUDIO_CTX.state === 'suspended') AUDIO_CTX.resume().catch(()=>{});\n  }catch(e){ AUDIO_CTX = null; }\n}\n\nfunction playWhoosh(){\n  if(!AUDIO_CTX || AUDIO_CTX.state !== 'running') return;\n  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;\n  try{\n    const t = AUDIO_CTX.currentTime;\n    const osc = AUDIO_CTX.createOscillator();\n    const gain = AUDIO_CTX.createGain();\n    osc.type = 'sine';\n    osc.frequency.setValueAtTime(200, t);\n    osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);\n    // short fade in/out so the burst doesn't click\n    gain.gain.setValueAtTime(0.0001, t);\n    gain.gain.exponentialRampToValueAtTime(0.05, t + 0.02);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);\n    osc.connect(gain).connect(AUDIO_CTX.destination);\n    osc.start(t);\n    osc.stop(t + 0.16);\n  }catch(e){}\n}\n\n\nconst WIPE = {busy:false, dur:700};\n\nfunction wipeTo(id, dir){\n  const target = document.getElementById(id);\n  const wrap   = document.getElementById('wipe');\n  const panel  = document.getElementById('wipePanel');\n  if(!target) return false;\n\n  const calm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  if(!wrap || !panel || calm) return false;\n  if(WIPE.busy) return true;                 // swallow clicks mid-transition\n  WIPE.busy = true;\n\n  const from = (dir === 'right') ? 'right' : 'left';\n  const current = currentSectionEl();\n  const scrollY = window.scrollY;\n\n  // lock scroll without the layout jumping when the bar disappears\n  const sw = window.innerWidth - document.documentElement.clientWidth;\n  document.body.style.overflow = 'hidden';\n  if(sw > 0) document.body.style.paddingRight = sw + 'px';\n\n  playWhoosh();\n\n  // ── 0ms: outgoing fades + panel wipes in\n  if(current && current !== target) current.classList.add('sec-out');\n  panel.className = 'wipe-panel';\n  void panel.offsetWidth;                    // restart the animation\n  wrap.classList.add('on');\n  panel.classList.add(from === 'left' ? 'in-left' : 'in-right');\n\n  // ── 300ms: fully covered → hold 100ms, do the scroll behind the panel\n  setTimeout(function(){\n    const root = document.documentElement;\n    const prev = root.style.scrollBehavior;\n    root.style.scrollBehavior = 'auto';      // instant: the panel hides it\n    if(current && current !== target) current.classList.remove('sec-out');\n    target.classList.add('sec-in');\n    target.scrollIntoView({block:'start'});\n    root.style.scrollBehavior = prev;\n  }, 300);\n\n  // ── 400ms: panel leaves the opposite edge, new section rises\n  setTimeout(function(){\n    panel.classList.remove('in-left','in-right');\n    void panel.offsetWidth;\n    panel.classList.add(from === 'left' ? 'out-right' : 'out-left');\n    target.classList.add('sec-in-run');\n  }, 400);\n\n  // ── 700ms: cleanup\n  setTimeout(function(){\n    wrap.classList.remove('on');\n    panel.className = 'wipe-panel';\n    target.classList.remove('sec-in','sec-in-run');\n    document.body.style.overflow = '';\n    document.body.style.paddingRight = '';\n    WIPE.busy = false;\n  }, WIPE.dur);\n\n  return true;\n}\n\n\nfunction currentSectionEl(){\n  let best = null, bestArea = 0;\n  SECTIONS.forEach(function(sid){\n    const el = document.getElementById(sid);\n    if(!el) return;\n    const r = el.getBoundingClientRect();\n    const vis = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0);\n    if(vis > bestArea){ bestArea = vis; best = el; }\n  });\n  return best;\n}\n\n\nfunction wipeDirFrom(el){\n  if(!el) return 'left';\n  const r = el.getBoundingClientRect();\n  return (r.left + r.width / 2) > window.innerWidth / 2 ? 'right' : 'left';\n}\n\nconst SECTIONS=['home','games','movies','scratch','runner','favs','settings','credits','contact'];\nfunction goTo(id){\n  if(!SECTIONS.includes(id))id='home';\n  closeMenu();\n  SECTIONS.forEach(name=>{const section=document.getElementById(name);if(section)section.classList.toggle('active',name===id)});\n  setActiveNav(id);\n  if(id==='games'&&!ST.loaded)loadGames();\n  if(id==='movies'&&window.BananaMovies)window.BananaMovies.render();\n  if(id==='favs')renderFavs();\n  if(id==='scratch')renderScratch();\n  try{history.replaceState(null,'','#'+id)}catch(_){}\n  window.scrollTo(0,0);\n}\nfunction setActiveNav(id){document.querySelectorAll('.nl').forEach(b=>b.classList.toggle('on',b.dataset.sec===id))}\nfunction toggleMenu(){document.getElementById('navLinks').classList.toggle('open')}\nfunction closeMenu(){document.getElementById('navLinks').classList.remove('open')}\nfunction initScrollSpy(){const id=location.hash.slice(1);if(SECTIONS.includes(id)&&id!=='home')goTo(id)}\n\nfunction toggleSrc(s){\n  CFG.sources[s]=!CFG.sources[s];\n  const el=document.getElementById('tg-'+s);if(el)el.classList.toggle('on',CFG.sources[s]);\n  saveAll();\n  const names={vault:'GN-Math',arcade:'UGS',mathscdn:'Maths CDN',selenite:'Selenite'};\n  toast((CFG.sources[s]?'Enabled ':'Disabled ')+(names[s]||s)+' — reload to apply');\n}\n\n\nconst THEMES = {\n  banana:{ac:'#ffd24a',ac2:'#f0a500',bg:'#0a0a0a',bg1:'#111111',bg2:'#181818',bg3:'#222222'},\n  bw:    {ac:'#ffffff',ac2:'#cccccc',bg:'#0a0a0a',bg1:'#111111',bg2:'#181818',bg3:'#222222'},\n  purple:{ac:'#a855f7',ac2:'#7c3aed',bg:'#08040f',bg1:'#100820',bg2:'#180d2c',bg3:'#221438'},\n  blue:  {ac:'#60a5fa',ac2:'#3b82f6',bg:'#030812',bg1:'#080e1e',bg2:'#0d1630',bg3:'#132040'},\n  green: {ac:'#34d399',ac2:'#10b981',bg:'#030d08',bg1:'#071410',bg2:'#0d1e18',bg3:'#132c22'},\n  red:   {ac:'#f87171',ac2:'#ef4444',bg:'#0f0303',bg1:'#1a0606',bg2:'#220a0a',bg3:'#2e0f0f'},\n  amber: {ac:'#fbbf24',ac2:'#d97706',bg:'#0d0800',bg1:'#181000',bg2:'#231800',bg3:'#2e2200'}\n};\nfunction applyTheme(name){\n  const t = THEMES[name] || THEMES.banana;\n  CFG.theme = name;\n  document.querySelectorAll('[data-tv]').forEach(s => s.classList.toggle('on', s.dataset.tv === name));\n  const R = document.documentElement;\n  R.style.setProperty('--ac',  t.ac);\n  R.style.setProperty('--ac2', t.ac2);\n  R.style.setProperty('--bg',  t.bg);\n  R.style.setProperty('--bg1', t.bg1);\n  R.style.setProperty('--bg2', t.bg2);\n  R.style.setProperty('--bg3', t.bg3);\n  const ca = document.getElementById('ca');  if(ca)  ca.value  = t.ac;\n  const cb = document.getElementById('cbg'); if(cb) cb.value = t.bg;\n  saveAll();\n}\nfunction lighten(hex, a){\n  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);\n  return '#' + [Math.min(255,r+a), Math.min(255,g+a), Math.min(255,b+a)].map(x => x.toString(16).padStart(2,'0')).join('');\n}\nfunction applyCustomColor(){\n  const ac = document.getElementById('ca').value  || '#ffd24a';\n  const bg = document.getElementById('cbg').value || '#0a0a0a';\n  const R = document.documentElement;\n  R.style.setProperty('--ac', ac);\n  R.style.setProperty('--ac2', ac);\n  R.style.setProperty('--bg', bg);\n  R.style.setProperty('--bg1', lighten(bg, 6));\n  R.style.setProperty('--bg2', lighten(bg, 12));\n  R.style.setProperty('--bg3', lighten(bg, 20));\n  CFG.theme = 'custom'; CFG.customAc = ac; CFG.customBg = bg;\n  document.querySelectorAll('[data-tv]').forEach(s => s.classList.remove('on'));\n  saveAll();\n}\nfunction applyBgImage(){\n  const url = (document.getElementById('bg-url').value || '').trim();\n  if(!url){ toast('⚠️ Paste an image URL first'); return; }\n  CFG.bgImage = url;\n  document.documentElement.style.setProperty('--bg-image', 'url(\"' + url + '\")');\n  document.documentElement.style.setProperty('--overlay-display', 'block');\n  CFG.overlayOn = true;\n  document.getElementById('tg-overlay').classList.add('on');\n  saveAll();\n  toast('✅ Background applied');\n}\nfunction clearBgImage(){\n  CFG.bgImage = null;\n  document.getElementById('bg-url').value = '';\n  document.documentElement.style.setProperty('--bg-image', 'none');\n  document.documentElement.style.setProperty('--overlay-display', 'none');\n  saveAll();\n  toast('Background cleared');\n}\nfunction setOverlay(v){\n  CFG.overlayOp = parseInt(v, 10);\n  document.documentElement.style.setProperty('--bg-overlay', 'rgba(10,10,10,' + (v/100) + ')');\n  const lbl = document.getElementById('ov-lbl'); if(lbl) lbl.textContent = v + '%';\n  saveAll();\n}\nfunction toggleOverlay(){\n  CFG.overlayOn = !CFG.overlayOn;\n  document.getElementById('tg-overlay').classList.toggle('on', CFG.overlayOn);\n  document.documentElement.style.setProperty('--overlay-display', (CFG.bgImage && CFG.overlayOn) ? 'block' : 'none');\n  saveAll();\n}\n\n\n\nfunction openPopup(title, html){\n  document.getElementById('popupTitle').textContent = title;\n  document.getElementById('popupBody').innerHTML = html;\n  document.getElementById('popupOverlay').classList.add('open');\n}\nfunction closePopup(){ document.getElementById('popupOverlay').classList.remove('open'); }\n\nfunction showContactPopup(){\n  openPopup('Contact', [\n    '<p><strong>Phone:</strong> <a href=\"tel:+15615659186\">(561) 565-9186</a></p>',\n    '<p><strong>Email:</strong> <a href=\"mailto:Calderman1@icloud.com\">Calderman1@icloud.com</a></p>',\n    '<p><strong>Email:</strong> <a href=\"mailto:the.crypt1c.core@gmail.com\">the.crypt1c.core@gmail.com</a></p>',\n    '<p><strong>Main Document:</strong> <a href=\"' + BNZ_DOC + '\" target=\"_blank\" rel=\"noopener\">BananaNetworkz Doc</a></p>'\n  ].join(''));\n}\n\nfunction showHK(){\n  openPopup('Keyboard Shortcuts', '<div class=\"hk-grid\">' + [\n    ['Esc','Close player / modal'],\n    ['F','Fullscreen the player'],\n    ['R','Random game'],\n    ['/','Focus search'],\n    ['S','Shuffle games'],\n    ['?','This screen']\n  ].map(r => '<div class=\"hk-row\"><span class=\"kbd\">' + r[0] + '</span><span class=\"hk-desc\">' + r[1] + '</span></div>').join('') + '</div>');\n}\n\n\nconst TILT_MAX = 12;          // degrees, max ±12\nconst TILT_LIFT = 20;         // translateZ in px\n\nfunction initCardTilt(){\n  const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;\n  const calm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n  if(!fine || calm) return;\n\n  ['gg','fg','sg'].forEach(function(cid){\n    const root = document.getElementById(cid);\n    if(!root) return;\n\n    let active = null;      // currently tilted card\n    let frame  = 0;         // rAF handle\n    let px = 0, py = 0;     // last pointer position\n\n    function apply(){\n      frame = 0;\n      if(!active) return;\n      // Measure the UNTRANSFORMED box: getBoundingClientRect() on a rotated\n      // element returns the expanded 3D bounding box, which feeds distorted\n      // values back in and makes the tilt drift and self-oscillate.\n      const r = geom(active);\n      if(!r.width || !r.height) return;\n      // pointer position normalised to -0.5 … +0.5 around the centre\n      const nx = (px - r.left) / r.width  - 0.5;\n      const ny = (py - r.top)  / r.height - 0.5;\n      // rotateX is inverted: pointer above centre tips the top edge away\n      active.style.setProperty('--ry', ( nx * TILT_MAX * 2).toFixed(2) + 'deg');\n      active.style.setProperty('--rx', (-ny * TILT_MAX * 2).toFixed(2) + 'deg');\n      active.style.setProperty('--mx', (((px - r.left) / r.width)  * 100).toFixed(1) + '%');\n      active.style.setProperty('--my', (((py - r.top)  / r.height) * 100).toFixed(1) + '%');\n    }\n\n    // layout-space rect, unaffected by any transform on the card\n    function geom(el){\n      const w = el.offsetWidth, h = el.offsetHeight;\n      let x = 0, y = 0, n = el;\n      while(n){ x += n.offsetLeft - n.scrollLeft; y += n.offsetTop - n.scrollTop; n = n.offsetParent; }\n      return {left:x - window.scrollX, top:y - window.scrollY, width:w, height:h};\n    }\n\n    function reset(card){\n      if(!card) return;\n      card.classList.remove('tilt');\n      card.style.removeProperty('--rx');\n      card.style.removeProperty('--ry');\n      card.style.removeProperty('--tz');\n      card.style.removeProperty('--mx');\n      card.style.removeProperty('--my');\n      card.style.willChange = '';\n    }\n\n    root.addEventListener('mousemove', function(e){\n      const card = e.target.closest('.gc');\n      if(card !== active){\n        reset(active);\n        active = card;\n        if(active){\n          active.classList.add('tilt');\n          active.style.setProperty('--tz', TILT_LIFT + 'px');\n        }\n      }\n      if(!active) return;\n      px = e.clientX; py = e.clientY;\n      if(!frame) frame = requestAnimationFrame(apply);\n    }, {passive:true});\n\n    // leaving the grid entirely, or scrolling it away, springs cards back\n    root.addEventListener('mouseleave', function(){\n      if(frame){ cancelAnimationFrame(frame); frame = 0; }\n      reset(active); active = null;\n    }, {passive:true});\n\n    // re-rendering the grid can orphan the active card\n    root.addEventListener('cardsrendered', function(){\n      reset(active); active = null;\n    });\n  });\n}\n\n\nfunction initDelegation(){\n  ['gg','fg','sg','rp-strip'].forEach(function(cid){\n    const root = document.getElementById(cid);\n    if(!root) return;\n    root.addEventListener('click', function(e){\n      const fav = e.target.closest('[data-fav]');\n      if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }\n      const dl = e.target.closest('[data-dl]');\n      if(dl){ e.stopPropagation(); downloadGame(dl.dataset.dl); return; }\n      const open = e.target.closest('[data-open]');\n      if(open){ e.stopPropagation(); const game = GAME_MAP.get(open.dataset.open); if(game){ const source = gameFile(game); if(source) openGameInBlank(game); } return; }\n      const play = e.target.closest('[data-play]');\n      if(play){ e.stopPropagation(); const game = GAME_MAP.get(play.dataset.play); if(game) openGame(game); return; }\n      const card = e.target.closest('[data-gid]');\n      if(card){ const g = GAME_MAP.get(card.dataset.gid); if(g) openGame(g); }\n    });\n  });\n\n  const tc = document.getElementById('tag-cloud');\n  if(tc) tc.addEventListener('click', function(e){\n    const p = e.target.closest('.tp');\n    if(p) setTag(p.dataset.tag || '');\n  });\n}\n\nfunction initKeys(){\n  document.addEventListener('keydown', function(e){\n    const tag = document.activeElement && document.activeElement.tagName;\n    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';\n    if(e.key === 'Escape'){\n      if(document.getElementById('popupOverlay').classList.contains('open')){ closePopup(); return; }\n      if(document.getElementById('playerOverlay').classList.contains('open')){ closePlayer(); return; }\n      closeMenu();\n      return;\n    }\n    if(typing) return;\n    const k = e.key.toLowerCase();\n    if(k === 'f'){ fsGame(); }\n    else if(k === 'r'){ randomGame(); }\n    else if(k === 's'){ setSort('shuf'); }\n    else if(e.key === '/'){ e.preventDefault(); const search = document.getElementById('srch'); if(search){ goTo('games'); setTimeout(()=>search.focus(), 400); } }\n    else if(e.key === '?'){ showHK(); }\n  });\n}\n\nfunction initInputs(){\n  const nav = document.getElementById('navSearch');\n  const srch = document.getElementById('srch');\n  const sc = document.getElementById('scSearch');\n\n  const runSearch = debounce(function(){ applyFilters(); }, 200);\n\n  if(srch) srch.addEventListener('input', function(){\n    ST.search = this.value.trim();\n    if(nav && nav.value !== this.value) nav.value = this.value;\n    runSearch();\n  });\n  if(nav) nav.addEventListener('input', function(){\n    ST.search = this.value.trim();\n    if(srch) srch.value = this.value;\n    runSearch();\n  });\n  if(nav) nav.addEventListener('keydown', function(e){ if(e.key === 'Enter') goTo('games'); });\n\n  if(sc) sc.addEventListener('input', debounce(function(){\n    ST.scSearch = sc.value.trim();\n    renderScratch();\n  }, 200));\n\n  const scId = document.getElementById('sc-id');\n  if(scId) scId.addEventListener('keydown', function(e){ if(e.key === 'Enter') addScratch(); });\n\n  window.addEventListener('scroll', function(){\n    const st = document.getElementById('scrolltop');\n    if(st) st.classList.toggle('show', window.scrollY > 500);\n  }, {passive:true});\n\n  document.addEventListener('click', function(e){\n    const nl = document.getElementById('navLinks');\n    if(nl.classList.contains('open') && !e.target.closest('#nav')) closeMenu();\n  });\n}\n\nfunction applyUI(){\n  const set = (id, value) => { const el = document.getElementById(id); if(el && value != null) el.value = value; };\n  set('custom-src-url', CFG.customSrc);\n  set('bg-url', CFG.bgImage || '');\n  const vault = document.getElementById('tg-vault'); if(vault) vault.classList.toggle('on', !!CFG.sources.vault);\n  const arcade = document.getElementById('tg-arcade'); if(arcade) arcade.classList.toggle('on', !!CFG.sources.arcade);\n  if(CFG.theme === 'custom' && CFG.customAc){\n    const accent = document.getElementById('ca'), background = document.getElementById('cbg');\n    if(accent) accent.value = CFG.customAc;\n    if(background) background.value = CFG.customBg || '#0a0a0a';\n    applyCustomColor();\n  }else{\n    applyTheme(CFG.theme || 'banana');\n  }\n  if(CFG.bgImage){\n    document.documentElement.style.setProperty('--bg-image', 'url(\"' + CFG.bgImage + '\")');\n    document.documentElement.style.setProperty('--overlay-display', CFG.overlayOn ? 'block' : 'none');\n  }\n  const overlay = document.getElementById('tg-overlay'); if(overlay) overlay.classList.toggle('on', !!CFG.overlayOn);\n  const range = document.getElementById('ov-range'); if(range) range.value = CFG.overlayOp;\n  const label = document.getElementById('ov-lbl'); if(label) label.textContent = CFG.overlayOp + '%';\n  document.documentElement.style.setProperty('--bg-overlay', 'rgba(10,10,10,' + (CFG.overlayOp / 100) + ')');\n}\n\n\nfunction initKineticLogo(){\n  const kin  = document.getElementById('kinLogo');\n  const word = document.getElementById('kinWord');\n  if(!kin || !word) return;\n\n  // split the wordmark into per-character spans (staggered 40ms)\n  const text = word.dataset.text || word.textContent;\n  word.textContent = '';\n  [...text].forEach((ch,i)=>{\n    const s = document.createElement('span');\n    s.className = 'kc';\n    s.textContent = ch;\n    s.style.setProperty('--i', i);\n    word.appendChild(s);\n  });\n  kin.style.setProperty('--n', text.length);\n\n  // exact stroke length so the dash animation is perfectly calibrated\n  const stroke = kin.querySelector('.kin-stroke');\n  if(stroke && stroke.getTotalLength){\n    const len = Math.ceil(stroke.getTotalLength());\n    kin.style.setProperty('--kin-len', len);\n  }\n\n  function play(){\n    kin.classList.remove('playing');\n    void kin.offsetWidth;          // force reflow so the animation restarts\n    kin.classList.add('playing');\n  }\n  kin.addEventListener('click', play);\n  kin.addEventListener('keydown', e=>{\n    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); play(); }\n  });\n  play();\n  window.replayHeroLogo = play;\n}\n\n\nconst SCRAMBLE_CHARS = '@#$%&*';\nlet _scrambleTimer = null;\n\nfunction runScramble(el, text, step){\n  step = step || 30;\n  let locked = 0;\n  clearInterval(_scrambleTimer);\n  _scrambleTimer = setInterval(function(){\n    if(locked > text.length){ clearInterval(_scrambleTimer); return; }\n    let out = text.slice(0, locked);\n    for(let i = locked; i < text.length; i++){\n      out += text[i] === ' '\n        ? ' '\n        : SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];\n    }\n    el.textContent = out;\n    locked++;\n  }, step);\n}\n\nlet _splashDone = false;\nfunction dismissSplash(){\n  if(_splashDone) return;\n  _splashDone = true;\n  clearInterval(_scrambleTimer);\n  const sp = document.getElementById('splash');\n  if(sp) sp.classList.add('gone');\n  document.removeEventListener('keydown', dismissSplash, true);\n  document.removeEventListener('pointerdown', dismissSplash, true);\n  const c=document.getElementById('gcnt');if(c&&!ST.loaded)c.textContent='Loads when opened';\n}\n\nfunction initSplash(){\n  const sp = document.getElementById('sp -history>Clear history</button><button class=\"ps-action\" data-p-clear-collections>Clear collections</button><button class=\"ps-action\" data-p-reset>Reset personalization</button></div></section></div></div>`;}\n  function toggle(field,label,checked){return `<label class=\"ps-toggle\"><input type=\"checkbox\" data-p-field=\"${field}\" ${checked?'checked':''}> ${label}</label>`;}\n  function collectionMarkup(){return data.collections.length?data.collections.map(item=>`<div class=\"ps-collection\"><b>${esc(item.icon||'🍌')}</b><span>${esc(item.name)} <small>(${item.items.length})</small></span><button class=\"ps-action\" data-p-open-collection=\"${esc(item.id)}\">View</button><button class=\"ps-action\" data-p-delete-collection=\"${esc(item.id)}\">×</button></div>`).join(''):'<p>No collections yet. Right-click a game card to add games after creating one.</p>';}\n  function renderSettings(){const root=$('#settings .sg');if(!root)return;const old=$('#ps-settings');if(old)old.remove();root.insertAdjacentHTML('beforeend',settingsMarkup());syncControls();storageUsage();}\n  function syncControls(){const root=$('#ps-settings');if(!root)return;$$('[data-p-field]',root).forEach(input=>{const value=getPath(data,input.dataset.pField);if(input.type==='checkbox')input.checked=!!value;else input.value=value;});}\n  function getPath(obj,path){return path.split('.').reduce((value,key)=>value?.[key],obj);}function setPath(obj,path,value){const parts=path.split('.');let current=obj;parts.slice(0,-1).forEach(key=>{current=current[key]||(current[key]={});});current[parts.at(-1)]=value;}\n  function storageUsage(){const el=$('#p-storage');if(!el)return;const personal=new Blob([JSON.stringify(data)]).size;const favorites=new Blob([localStorage.getItem('bnz_favs')||'']).size;el.textContent=`Personal: ${(personal/1024).toFixed(1)} KB · Favorites: ${(favorites/1024).toFixed(1)} KB · ${data.stats.recent.length} recent plays`;}\n  function decorateCards(root=document){$$('.gc[data-gid]',root) o ${collection.name}`);}\n  function viewCollection(id){const collection=data.collections.find(item=>item.id===id);if(!collection)return;const games=collection.items.map(findGame).filter(Boolean);if(!games.length){toast('This collection is empty');return;}const grid=$('#gg');if(!grid)return;ST.visible=games;ST.rendered=0;renderGrid();goTo('games');toast(`Showing ${collection.name}`);}\n  function showContext(game,x,y){const menu=$('#p-context');if(!menu)return;contextGame=game;menu.style.left=`${Math.min(x,window.innerWidth-205)}px`;menu.style.top=`${Math.min(y,window.innerHeight-125)}px`;menu.innerHTML=`<button data-p-context-play>▶ Play ${esc(game.title)}</button><button data-p-context-open>↗ Open in new tab</button><button data-p-context-add>＋ Add to collection</button>`;menu.classList.add('open');}\n  function hideContext(){const menu=$('#p-context');if(menu)menu.classList.remove('open');contextGame=null;}\n  function exportData(){const payload={format:'BananaFile personalization',version:1,createdAt:now(),personal:data,favorites:ST?.favs||[]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`bananafile-personal-${now().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),800);toast('Personal data exported');}\n  function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!valid(parsed.personal))throw new Error('Invalid file');data=Object.assign(defaults(),parsed.personal);if(Array.isArray(parsed.favorites)){ST.favs=parsed.favorites;saveAll();}save();applyTheme();renderSettings();refresh();toast('Personal data imported');}catch(error){toast('⚠️ Import file is not valid');}};reader.readAsText(file);}\n  function reset(){if(!confirm('Reset local personalization, profile, collections and play history? Existi xtGame)openGameInBlank(contextGame);hideContext();return;}if(target.closest('[data-p-context-add]')){if(contextGame)addToCollection(contextGame.id);hideContext();return;}if(target.id==='p-context')hideContext();});\n    document.addEventListener('input',event=>{const input=event.target,field=input.dataset?.pField;if(input.dataset?.pColor){data.theme='custom';data.custom=Object.assign({},palette(),{[input.dataset.pColor]:input.value});save();applyTheme();refresh();return;}if(!field)return;let value=input.type==='checkbox'?input.checked:input.value;if(input.type==='range'||input.type==='number')value=Number(value);setPath(data,field,value);const output=$('output',input.parentElement);if(output)output.textContent=field==='notifications.duration'?`${value/1000}s`:value;save();applyTheme();refresh();});\n    document.addEventListener('change',event=>{const input=event.target,field=input.dataset?.pField;if(field==='theme'){if(!setThemeFromSaved(input.value)){data.theme=input.value;if(input.value!=='custom')data.custom={};}save();applyTheme();renderSettings();refresh();}if(input.id==='p-import')importData(input.files[0]);});\n    document.addEventListener('contextmenu',event=>{const card=event.target.closest('.gc[data-gid]');if(!card)return;const game=findGame(card.dataset.gid);if(!game)return;event.preventDefault();showContext(game,event.clientX,event.clientY);});\n    document.addEventListener('keydown',event=>{if(event.key==='Escape')hideContext();if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(event.key.toLowerCase()==='g')goTo('games');if(event.key.toLowerCase()==='m')goTo('movies');if(event.key.toLowerCase()==='r')goTo('runner');if(event.key.toLowerCase()==='h')goTo('home');if(event.key.toLowerCase()==='c')goTo('contact');if(event.key.toLowerCase()==='d'&&ST?.cur)downloadGame();});\n    const observer=new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)decorateCards(node);}))
